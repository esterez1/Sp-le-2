<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dab speles eksperts</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }

/* MAINI ŠEIT: varoņa kartītes izskats */
h1 { text-align: center; }
.kartite {
  background-color: #a8e0a2;
  border: 2px solid #719ccf;
  border-radius: 12px;
  max-width: 360px;
  margin: 20px auto;
  text-align: center;
  padding: 16px;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>eksperts</h1>
<div class="kartite">
  <p>dab speles eksperts zin visus speles noteikumus un trikus lai uzvarētu katru spli.</p>
  <img src="varonis.png" alt="cilvēks ar brillēm un augstu cepuri, izskatas gudrs." width="128">
  <p>uzvar katru spēli</p>
</div>
</body>
</html>
