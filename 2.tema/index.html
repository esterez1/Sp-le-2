<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dabbin</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #e08888;
  color: #8de9bb;
}

h1 {
  color: #77adeb;
  font-size: 36px;
  text-align: center;
}

.noteikumi {
  background-color: #e4b671;
  color: #920707;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px solid #326cbe;
  background-color: #1f4d1d;
  box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
}

button {
  background-color: #28047e;
  color: #da03b6;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Dabbin</h1>
<p>Īss spēles mērķa apraksts spēlētājam.</p>
<section class="noteikumi">
  <h2>Dabbin Noteikumi</h2>
  <p>Ja spēlētājs spēli vinē, dzird skaņu Dab</p>
  <p>ja spēli zaudē dzird skaņu womp womp</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/ronis.png" alt="Spēles varonis" width="128">
  <p>Skaņas efekta nozīme spēlē:</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
